# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    - go mod download
    - go mod tidy

builds:
  - main: ./cmd/awesome-directories
    binary: awesome-directories
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "6"
      - "7"
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -extldflags '-static'
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X main.builtBy=goreleaser
    flags:
      - -trimpath

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- tolower .Os }}_
      {{- if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "merge conflict"
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "Bug fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: "Performance improvements"
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999

dist: .goreleaser-dist

release:
  draft: false
  prerelease: auto
  header: |
    ## What's Changed

    This release includes the following changes:
  footer: |
    ## Installation

    ### Homebrew (macOS/Linux)
    ```bash
    brew tap awesome-directories/tap
    brew install awesome-directories
    ```

    ### Go Install
    ```bash
    go install github.com/awesome-directories/cli/cmd/awesome-directories@{{ .Tag }}
    ```

    ### Manual Download
    Download the appropriate binary for your platform from the assets below.

    **Full Changelog**: https://github.com/awesome-directories/cli/compare/{{ .PreviousTag }}...{{ .Tag }}

checksum:
  name_template: checksums.txt
  algorithm: sha256

brews:
  - name: awesome-directories
    repository:
      owner: awesome-directories
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://awesome-directories.com"
    description: "CLI tool for awesome-directories.com - Discover directories for your SaaS"
    license: "Apache-2.0"
    test: |
      system "#{bin}/awesome-directories version"
    install: |
      bin.install "awesome-directories"
