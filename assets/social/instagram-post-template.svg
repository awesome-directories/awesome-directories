      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#igGradient)"/>

  <!-- Pattern overlay -->
  <g opacity="0.08">
