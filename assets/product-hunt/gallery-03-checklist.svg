    <rect x="0" y="64" width="800" height="2" fill="#e2e8f0"/>

    <text x="32" y="45" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#1f2937">
      Your Launch Checklist
    </text>

    <text x="32" y="90" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#6b7280">
      15 directories selected
    </text>

    <!-- Close button -->
    <circle cx="750" cy="40" r="20" fill="#e2e8f0"/>
    <text x="750" y="46" font-family="sans-serif" font-size="20" fill="#64748b" text-anchor="middle">×</text>

    <!-- Checklist items -->
    <g transform="translate(32, 120)">
      <!-- Item 1 - Checked -->
      <g>
        <rect x="0" y="0" width="736" height="56" rx="8" fill="#f8fafc"/>
        <rect x="16" y="16" width="24" height="24" rx="6" fill="#10b981"/>
        <path d="M 22 28 L 26 32 L 34 24" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

        <text x="52" y="33" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#10b981">
          ✓ Product Hunt
        </text>

        <rect x="200" y="18" width="50" height="20" rx="10" fill="#10b981" opacity="0.1"/>
        <text x="225" y="31" font-family="monospace" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle">
          DR 90
        </text>

        <text x="620" y="33" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#10b981">
          Submitted ✓
        </text>
      </g>

      <!-- Item 2 - Checked -->
      <g transform="translate(0, 66)">
        <rect x="0" y="0" width="736" height="56" rx="8" fill="#f8fafc"/>
        <rect x="16" y="16" width="24" height="24" rx="6" fill="#10b981"/>
        <path d="M 22 28 L 26 32 L 34 24" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

        <text x="52" y="33" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#10b981">
          ✓ Hacker News
        </text>

        <rect x="200" y="18" width="50" height="20" rx="10" fill="#10b981" opacity="0.1"/>
        <text x="225" y="31" font-family="monospace" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle">
          DR 89
        </text>

        <text x="620" y="33" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#10b981">
          Submitted ✓
        </text>
      </g>

      <!-- Item 3 - Unchecked -->
      <g transform="translate(0, 132)">
        <rect x="0" y="0" width="736" height="56" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <rect x="16" y="16" width="24" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

        <text x="52" y="33" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1f2937">
