      <rect x="0" y="0" width="200" height="48" rx="10" fill="#3b82f6"/>
      <text x="100" y="31" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">
