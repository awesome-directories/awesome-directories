      <rect x="220" y="0" width="180" height="48" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <text x="310" y="31" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#64748b" text-anchor="middle">
        Share List
      </text>

      <rect x="420" y="0" width="150" height="48" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <text x="495" y="31" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#64748b" text-anchor="middle">
