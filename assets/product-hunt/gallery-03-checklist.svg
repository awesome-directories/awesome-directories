        </text>

        <text x="640" y="33" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6b7280">
          Pending
        </text>
      </g>

      <!-- Item 4 - Unchecked -->
      <g transform="translate(0, 198)">
        <rect x="0" y="0" width="736" height="56" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <rect x="16" y="16" width="24" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

        <text x="52" y="33" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1f2937">
          BetaList
        </text>

        <rect x="200" y="18" width="50" height="20" rx="10" fill="#10b981" opacity="0.1"/>
        <text x="225" y="31" font-family="monospace" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle">
          DR 60
        </text>

        <text x="640" y="33" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6b7280">
          Pending
        </text>
      </g>

      <!-- Item 5 - Unchecked -->
      <g transform="translate(0, 264)">
        <rect x="0" y="0" width="736" height="56" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <rect x="16" y="16" width="24" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

        <text x="52" y="33" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1f2937">
          SaaSHub
        </text>

        <rect x="200" y="18" width="50" height="20" rx="10" fill="#10b981" opacity="0.1"/>
        <text x="225" y="31" font-family="monospace" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle">
