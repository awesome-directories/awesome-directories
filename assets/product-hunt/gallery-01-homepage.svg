<svg width="1270" height="760" viewBox="0 0 1270 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Screenshot mockup background -->
  <rect width="1270" height="760" fill="#f8fafc"/>

  <!-- Browser chrome mockup -->
  <g id="browser-chrome">
    <rect x="40" y="40" width="1190" height="680" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Browser bar -->
    <rect x="40" y="40" width="1190" height="48" rx="12" fill="#f1f5f9"/>
    <rect x="40" y="76" width="1190" height="2" fill="#e2e8f0"/>
    <!-- Browser dots -->
    <circle cx="64" cy="64" r="6" fill="#ef4444"/>
    <circle cx="88" cy="64" r="6" fill="#f59e0b"/>
    <circle cx="112" cy="64" r="6" fill="#10b981"/>
    <!-- URL bar -->
    <rect x="140" y="52" width="800" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="160" y="69" font-family="monospace" font-size="13" fill="#64748b">
      https://awesome-directories.com
    </text>
  </g>

  <!-- Content mockup -->
  <g transform="translate(80, 130)">
    <!-- Logo and title -->
    <g>
      <path d="M0 8C0 6.89543 0.895431 6 2 6H6L8 10H16C17.1046 10 18 10.8954 18 12V14H0V8Z" fill="#3b82f6"/>
      <path d="M0 12H18V32C18 33.1046 17.1046 34 16 34H2C0.895431 34 0 33.1046 0 32V12Z" fill="#3b82f6"/>
      <path d="M9 17L9.75 19.25L12 20L9.75 20.75L9 23L8.25 20.75L6 20L8.25 19.25L9 17Z" fill="#ffffff"/>

      <text x="28" y="26" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1f2937">
        awesome-directories
      </text>
    </g>

    <!-- Hero section -->
    <text x="0" y="90" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="800" fill="#1f2937">
      Find the Top 20 Directories
    </text>
    <text x="0" y="140" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="800" fill="#1f2937">
      in Under 3 Minutes
    </text>

    <text x="0" y="190" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#6b7280">
      Stop wasting time on dead links from 2012. Get dofollow backlinks from high-DR
    </text>
    <text x="0" y="220" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#6b7280">
      directories that actually drive traffic.
    </text>

    <!-- CTA button mockup -->
    <rect x="0" y="260" width="220" height="56" rx="12" fill="#3b82f6"/>
    <text x="110" y="293" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">
      Start Browsing →
    </text>

    <!-- Stats -->
    <g transform="translate(0, 350)">
      <rect x="0" y="0" width="1100" height="220" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

      <g transform="translate(30, 30)">
        <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#6b7280">
          FILTER BY DOMAIN RATING
        </text>

        <!-- Slider mockup -->
        <rect x="0" y="20" width="500" height="8" rx="4" fill="#e2e8f0"/>
        <rect x="0" y="20" width="300" height="8" rx="4" fill="#3b82f6"/>
        <circle cx="300" cy="24" r="12" fill="#3b82f6" stroke="#ffffff" stroke-width="3"/>

        <text x="0" y="60" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#1f2937">
          DR 70+
        </text>
        <text x="120" y="60" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#6b7280">
          142 directories found
        </text>

        <!-- Feature badges -->
        <g transform="translate(0, 90)">
          <rect x="0" y="0" width="140" height="36" rx="18" fill="#10b981" opacity="0.1"/>
          <text x="70" y="23" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#10b981" text-anchor="middle">
            ✓ Dofollow Only
          </text>

          <rect x="160" y="0" width="120" height="36" rx="18" fill="#3b82f6" opacity="0.1"/>
          <text x="220" y="23" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#3b82f6" text-anchor="middle">
            Free Only
          </text>

          <rect x="300" y="0" width="180" height="36" rx="18" fill="#6b7280" opacity="0.1"/>
          <text x="390" y="23" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#6b7280" text-anchor="middle">
            Tech Category
          </text>
        </g>
      </g>
    </g>
  </g>

  <!-- Caption -->
  <text x="635" y="745" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#3b82f6" text-anchor="middle">
    Homepage - Hero &amp; Quick Filters
  </text>
</svg>
