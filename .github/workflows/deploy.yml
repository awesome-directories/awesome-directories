name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAUTIC_BASE_URL: ${{ secrets.VITE_MAUTIC_BASE_URL }}
          VITE_MAUTIC_FORM_ID: ${{ secrets.VITE_MAUTIC_FORM_ID }}
          VITE_PIRSCH_SITE_ID: ${{ secrets.VITE_PIRSCH_SITE_ID }}
          VITE_GITHUB_REPO: ${{ secrets.VITE_GITHUB_REPO }}
          VITE_GITHUB_REPO_ID: ${{ secrets.VITE_GITHUB_REPO_ID }}
          VITE_GITHUB_CATEGORY: ${{ secrets.VITE_GITHUB_CATEGORY }}
          VITE_GITHUB_CATEGORY_ID: ${{ secrets.VITE_GITHUB_CATEGORY_ID }}
          VITE_APP_NAME: "Awesome Directories"
          VITE_APP_URL: "https://awesome-directories.github.io/awesome-directories"
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
